[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomarker-nlp"
version = "0.1.0"
description = "Rule-based NLP pipeline for extracting breast cancer biomarker status (ER/PR/HER2/Ki-67) from clinical text"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "scikit-learn>=1.1",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
biomarker-nlp = "biomarker_nlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
